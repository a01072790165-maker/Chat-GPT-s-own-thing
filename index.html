<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080b12"><title>TETRIS — Mobile</title><link rel="stylesheet" href="style.css"></head><body><main class="game-wrap"><header><div><p class="eyebrow">CHATGPT EDITION</p><h1>TETRIS</h1></div><button id="newGame" class="btn" type="button">NEW GAME</button></header><section class="game"><div class="board-shell"><div id="board" class="board" aria-label="테트리스 게임판"></div><div id="overlay" class="overlay"><h2>READY?</h2><p>아래 START 버튼을 눌러 시작</p><button id="startGame" class="start-btn" type="button">START</button></div></div><aside class="panel"><div class="stat"><span>SCORE</span><strong id="score">0</strong></div><div class="stat"><span>LINES</span><strong id="lines">0</strong></div><div class="stat"><span>LEVEL</span><strong id="level">1</strong></div><div class="next-box"><span>NEXT</span><div id="next" class="next"></div></div><div class="controls"><h3>CONTROLS</h3><p>키보드: ← → 이동 · ↑ 회전</p><p>↓ 빠르게 · SPACE 즉시 낙하 · P 일시정지</p></div></aside></section><section class="mobile-controls" aria-label="모바일 조작"><button type="button" data-action="left">←</button><button type="button" data-action="rotate">↻</button><button type="button" data-action="right">→</button><button type="button" data-action="down">↓</button><button type="button" data-action="drop">DROP</button></section><footer>화면 버튼으로 플레이할 수 있습니다.</footer></main><script src="script.js"></script></body></html>
